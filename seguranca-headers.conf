# Hardening de cabeçalhos de segurança — Cenário B (versão 2, 26/10/2026)
# Cada diretiva corresponde a avisos identificados na auditoria OWASP ZAP

# Anti-clickjacking: impede que a página seja embutida em iframes de outros sites
Header always set X-Frame-Options "SAMEORIGIN"

# Impede o navegador de interpretar arquivos com tipo MIME diferente do declarado
Header always set X-Content-Type-Options "nosniff"

# Controla quais recursos a página pode carregar (mitiga XSS e injeção de conteúdo)
# v2: frame-ancestors e form-action não herdam de default-src e precisam ser explícitas
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; form-action 'self'"

# Controla o vazamento de informação via cabeçalho Referer
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Restringe o uso de recursos do navegador (câmera, microfone, geolocalização)
Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

# Reforça o uso de cookies seguros
# v2: os cookies do WordPress/WooCommerce são criados pelo PHP, então a edição é repetida
# nas duas tabelas do mod_headers (always e onsuccess), como orienta a documentação do Apache.
# O padrão (?!...) só acrescenta o atributo quando o cookie ainda não o tem (evita duplicar).
Header always edit Set-Cookie "(?i)^((?!.*;\s*httponly).*)$" "$1; HttpOnly"
Header onsuccess edit Set-Cookie "(?i)^((?!.*;\s*httponly).*)$" "$1; HttpOnly"
Header always edit Set-Cookie "(?i)^((?!.*;\s*samesite=).*)$" "$1; SameSite=Strict"
Header onsuccess edit Set-Cookie "(?i)^((?!.*;\s*samesite=).*)$" "$1; SameSite=Strict"

# Suprime o vazamento da versão do servidor e da linguagem
# (o X-Powered-By também é desligado no PHP com expose_php = Off, arquivo seguranca-php.ini)
Header always unset X-Powered-By
Header onsuccess unset X-Powered-By
ServerTokens Prod
ServerSignature Off
